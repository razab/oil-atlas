name: Publish static atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate canary data before publication
        run: python3 scripts/normalize.py --verify data/validation-canary/manifest.json
      - uses: actions/configure-pages@v5
      - name: Assemble public files
        run: |
          mkdir -p public/data public/vendor
          cp index.html app.js style.css data-loader.js validation.html validation.js public/
          cp -R data/validation-canary public/data/
          cp data/snapshot.json data/world.json data/trade.json data/connections.json data/us-states.json public/data/
          cp vendor/* public/vendor/
          cp data/LICENSE-world-atlas.txt data/LICENSE-us-atlas.txt public/data/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
